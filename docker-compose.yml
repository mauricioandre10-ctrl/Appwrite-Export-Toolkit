services:
  appwrite-export-toolkit:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      APPWRITE_ENDPOINT: "${APPWRITE_ENDPOINT}"
      APPWRITE_PROJECT_ID: "${APPWRITE_PROJECT_ID}"
      APPWRITE_API_KEY: "${APPWRITE_API_KEY}"
      APPWRITE_TARGET_ENDPOINT: "${APPWRITE_TARGET_ENDPOINT:-}"
      APPWRITE_TARGET_PROJECT_ID: "${APPWRITE_TARGET_PROJECT_ID:-}"
      APPWRITE_TARGET_API_KEY: "${APPWRITE_TARGET_API_KEY:-}"
      BACKUP_OUTPUT_DIR: "/data/backups"
      BACKUP_FORMAT_VERSION: "${BACKUP_FORMAT_VERSION:-1.0.0}"
    volumes:
      - appwrite-export-toolkit-data:/data
    restart: unless-stopped

volumes:
  appwrite-export-toolkit-data:
